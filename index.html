<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <div class="item1">home page</div>
        <div class="item2">about me</div>
        <div class="item3">my links</div>
        <div class="item4">games</div>
    </div>

    <div class="box">
        <span class="border-line"></span>
        
        <form>
            <h1>Login</h1>
            
            <div class="input-box">
                <input type="email" required="required">
                <span>Email</span>
                <i></i>
            </div>
            
            <div class="input-box">
                <input type="password" required="required">
                <span>Password</span>
                <i></i>
            </div>

            <div class="links">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <input type="submit" value="Login">
            
            
        </form>
    </div>
    
</body>
</html>
